<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Erfan Nasirzadeh Orang</title>
<meta name="description" content="Erfan Nasirzadeh Orang: physics, machine learning and visualization, drawn as a Venn diagram of projects. Seeking a PhD position for Fall 2027 or Spring 2028.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Serif+Display&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --ink:#f4f1ea; --ink2:#b9b5ac; --ink3:#77736b;
  --card:#fffdf8; --cardInk:#111; --edge:#111; --gold:#e7c26b;
  --hand:'Caveat',cursive; --serif:'DM Serif Display',Georgia,serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
:root[data-theme="dark"]{--bg:#000}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--mono);overflow-x:hidden;
  background-image:radial-gradient(1200px 700px at 65% 50%,#0d0d0d,#000 70%)}
a{color:inherit}
.page{min-height:100svh;display:grid;grid-template-columns:minmax(300px,32%) 1fr;align-items:center;gap:0;padding:24px max(24px,env(safe-area-inset-right)) 24px max(24px,env(safe-area-inset-left))}
/* left */
.hello{font-family:var(--serif);font-weight:400;font-size:clamp(44px,5.4vw,84px);line-height:1;margin:0;letter-spacing:-.01em}
.hello span{display:block;opacity:0;transform:translateY(14px);animation:up .9s cubic-bezier(.2,.7,.1,1) forwards}
.hello span:nth-child(2){animation-delay:.12s}.hello span:nth-child(3){animation-delay:.24s}
.sub{margin:22px 0 4px;font-size:15px;letter-spacing:.04em;font-weight:700}
.ket{font-size:15px;color:var(--ink2);letter-spacing:.06em}
.me{display:flex;align-items:flex-end;gap:18px;margin-top:30px;flex-wrap:wrap}
.photo{width:170px;height:200px;border-radius:18px;border:2px solid #222;background:linear-gradient(160deg,#2a2722,#141311);display:grid;place-items:center;font:700 44px var(--serif);color:#6f6a60;overflow:hidden;flex:none}
.photo img{width:100%;height:100%;object-fit:cover}
.name{font-family:var(--mono);font-weight:700;font-size:clamp(26px,2.6vw,38px);line-height:1.05;letter-spacing:-.02em;margin:18px 0 0}
.seek{display:inline-block;margin-top:16px;border:1px dashed #555;border-radius:999px;padding:6px 14px;font-size:12.5px;color:var(--ink2)}
.notice{margin-top:12px;font-family:var(--hand);font-size:22px;color:var(--gold);line-height:1.15;max-width:340px}
.links{display:flex;flex-wrap:wrap;gap:16px;margin-top:18px;font-size:13px}
.links a{color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
.links a:hover{color:var(--ink)}
/* stage */
.stage{position:relative;width:100%;max-width:1150px;aspect-ratio:1000/800;justify-self:center}
.stage svg.venn{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.venn circle{transform-origin:center;transform-box:fill-box;opacity:0;animation:pop 1.2s cubic-bezier(.2,.7,.1,1) forwards}
.venn circle:nth-of-type(2){animation-delay:.15s}.venn circle:nth-of-type(3){animation-delay:.3s}
.vlabel{font-family:var(--mono);font-size:15px;fill:var(--ink);text-decoration:underline;font-weight:700}
.vcenter{font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:.14em;fill:var(--ink)}
.tile{position:absolute;transform:translate(-50%,-50%) rotate(var(--rot,0deg));width:13.6%;height:15.4%;overflow:hidden;background:var(--card);color:var(--cardInk);border:2px solid var(--edge);border-radius:14px;
  padding:clamp(4px,.7vw,10px) clamp(4px,.6vw,9px) clamp(3px,.5vw,7px);display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;font:inherit;
  transition:transform .3s cubic-bezier(.2,.7,.1,1),box-shadow .3s;opacity:0;animation:tileIn .7s cubic-bezier(.2,.7,.1,1) forwards;animation-delay:var(--d,0s)}
.tile:hover,.tile:focus-visible{transform:translate(-50%,-50%) rotate(0deg) scale(1.2);box-shadow:0 12px 28px rgba(0,0,0,.55);z-index:10;outline:none}
.tile:focus-visible{box-shadow:0 0 0 3px var(--gold),0 12px 28px rgba(0,0,0,.55)}
.tile b{font-family:var(--hand);font-weight:700;font-size:clamp(10px,1.3vw,20px);line-height:.92;text-align:center}
.tile svg{width:66%;height:auto;aspect-ratio:100/60;flex:none;overflow:visible}
.tile i{white-space:nowrap;font-style:normal;font-family:var(--mono);font-size:clamp(6.5px,.62vw,10px);letter-spacing:.06em;text-transform:uppercase;color:#555}
.tile.soon{border-style:dashed}
.deco{position:absolute;pointer-events:none;font-family:var(--hand);color:var(--ink)}
.hint{left:9%;top:11%;transform:rotate(-14deg);font-size:clamp(16px,2vw,30px);line-height:1.05;text-align:center;opacity:0;animation:fade 1s 1.6s forwards}
.cv{position:absolute;left:91.5%;top:13%;transform:translate(-50%,-50%);width:9%;aspect-ratio:.78;border:2px solid #ddd;border-radius:10px;background:#141414;cursor:pointer;transition:transform .3s;display:block;opacity:0;animation:tileIn .7s 1.4s forwards}
.cv:hover,.cv:focus-visible{transform:translate(-50%,-50%) scale(1.15);outline:none}
.cv span{position:absolute;left:12%;right:12%;height:3%;background:#444;border-radius:2px}
.cvlab{left:91.5%;top:27%;transform:translateX(-50%);font-size:clamp(14px,1.8vw,28px);white-space:nowrap}
.gp{position:absolute;left:84%;top:44%;width:16%;pointer-events:none;opacity:0;animation:fade 1s 1.8s forwards}
.formula{white-space:nowrap;left:93%;top:79%;transform:translateX(-50%);font-size:clamp(20px,2.8vw,44px);line-height:1;text-align:center;opacity:0;animation:fade 1s 2s forwards}
.formula small{display:block;font-size:.5em;color:var(--ink2);margin-top:4px}
.arrowL{position:absolute;left:-1%;top:44%;width:13%;pointer-events:none;opacity:0;animation:fade 1s 1.7s forwards}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:#0f0e0c;border-left:1px solid #2a2824;z-index:50;transform:translateX(102%);transition:transform .45s cubic-bezier(.2,.7,.1,1);
  padding:28px max(26px,env(safe-area-inset-right)) 40px 28px;overflow-y:auto}
.drawer.on{transform:none}
.drawer .x{all:unset;cursor:pointer;position:absolute;top:18px;right:max(18px,env(safe-area-inset-right));width:36px;height:36px;border-radius:50%;border:1px solid #3a3731;display:grid;place-items:center;font-size:18px}
.drawer .x:focus-visible{outline:2px solid var(--gold)}
.drawer .art{background:var(--card);border:2px solid var(--edge);border-radius:14px;padding:16px;margin:26px 0 18px;display:grid;place-items:center}
.drawer .art svg{width:70%;height:120px}
.drawer .area{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.drawer h2{font-family:var(--hand);font-weight:700;font-size:40px;line-height:1;margin:6px 0 14px}
.drawer h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:20px 0 6px;font-weight:400}
.drawer p{margin:0;color:var(--ink2);font-size:14px;line-height:1.6}
.drawer p.q{color:var(--ink);font-family:var(--serif);font-size:21px;line-height:1.3}
.drawer .lk{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.drawer .lk a{font-size:12.5px;text-decoration:none;border:1px solid #444;border-radius:999px;padding:6px 12px}
.drawer .lk a:hover{border-color:var(--gold);color:var(--gold)}
mark.needs{background:none;color:var(--gold);border-bottom:1px dashed var(--gold)}
/* below the fold */
.more{max-width:1100px;margin:0 auto;padding:30px max(24px,env(safe-area-inset-right)) 60px max(24px,env(safe-area-inset-left))}
.more h4{font-family:var(--hand);font-size:34px;font-weight:700;margin:40px 0 12px}
.pubs{list-style:none;padding:0;margin:0;border-top:1px dashed #333}
.pubs li{padding:14px 0;border-bottom:1px dashed #333;font-size:13.5px;color:var(--ink2)}
.pubs li b.t{display:block;color:var(--ink);font-family:var(--serif);font-weight:400;font-size:18px;line-height:1.3;margin-bottom:4px}
.pubs li .me{display:inline;font-weight:700;color:var(--ink)}
.pubs a{color:var(--gold)}
.list{display:none}
.foot{color:var(--ink3);font-size:12px;margin-top:40px}
@keyframes up{to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes tileIn{from{opacity:0;translate:0 14px}to{opacity:1;translate:0 0}}
/* phone: Venn with numbered dots, cards listed below */
@media (max-width:860px){
  .tile{height:auto;aspect-ratio:1}
  .page{grid-template-columns:1fr;gap:20px;padding-top:32px}
  .tile{width:7.5%;aspect-ratio:1;border-radius:50%;padding:0;justify-content:center}
  .tile b,.tile svg,.tile i{display:none}
  .tile:after{content:attr(data-n);font:700 11px var(--mono)}
  .hint,.gp,.formula,.arrowL{display:none}
  .cv,.cvlab{display:none}
  .vlabel{font-size:26px}.vcenter{font-size:22px}
  .list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .list .grp{grid-column:1/-1;font-family:var(--hand);font-size:26px;font-weight:700;margin-top:10px}
  .list button{all:unset;cursor:pointer;background:var(--card);color:var(--cardInk);border:2px solid var(--edge);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
  .list button:focus-visible{outline:3px solid var(--gold)}
  .list button b{font-family:var(--hand);font-size:21px;line-height:1}
  .list button svg{width:80%;height:52px}
  .list button i{font-style:normal;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:#555}
  .list button span{font:700 10px var(--mono);color:#888}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.hello span,.tile,.hint,.cv,.gp,.formula,.arrowL,.venn circle{opacity:1!important;transform:none}.tile{transform:translate(-50%,-50%)}.cv{transform:translate(-50%,-50%)}}
</style>
</head>
<body>

<main>
<section class="page" aria-label="Introduction and map of my work">
  <div class="left">
    <h1 class="hello" id="hello"></h1>
    <p class="sub" id="sub"></p>
    <p class="ket" id="ket"></p>
    <div class="me"><div class="photo" id="photo" aria-label="Photo placeholder">EN</div></div>
    <p class="name" id="name"></p>
    <span class="seek" id="seek"></span>
    <p class="notice" id="notice"></p>
    <div class="links" id="links"></div>
  </div>
  <div class="stage" id="stage">
    <svg class="venn" id="venn" viewBox="0 0 1000 800" aria-hidden="true"></svg>
    <svg class="arrowL" viewBox="0 0 140 60" aria-hidden="true"><path d="M4 18 C 40 8, 80 30, 128 40" fill="none" stroke="#f4f1ea" stroke-width="2.4" stroke-linecap="round"/><path d="M112 30 L130 41 L114 52" fill="none" stroke="#f4f1ea" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="deco hint">Click around to<br>explore my<br>work!</div>
    <a class="cv" id="cvlink" href="cv.pdf" aria-label="Open my CV (PDF)"></a>

    <svg class="gp" viewBox="0 0 160 110" aria-hidden="true">
      <path d="M6 60 C 30 20, 50 25, 70 55 S 120 95, 154 40 L154 70 C 120 120, 90 90, 70 80 S 30 50, 6 90 Z" fill="rgba(231,194,107,.18)" stroke="none"/>
      <path d="M6 75 C 30 35, 50 40, 70 67 S 120 108, 154 55" fill="none" stroke="#f4f1ea" stroke-width="2.4" stroke-linecap="round"/>

</section>

<section class="more" aria-label="All projects and papers">
  <div class="list" id="list"></div>

  <p class="foot">© 2026 Erfan Nasirzadeh Orang · Last updated November 2026 · wv7 "Venn"</p>
</section>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle" aria-hidden="true">

  <div class="area" id="dArea"></div>
  <h2 id="dTitle"></h2>

  <h3>What I did</h3><p id="dDid"></p>
  <h3>What came out of it</h3><p id="dFound"></p>
  <div class="lk" id="dLinks"></div>
</aside>

<script src="content.js"></script>
<script>
(function(){
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
/* unconfirmed gaps (NEEDS: ...) stay hidden on the public site */
function txt(s){return esc(s).replace(/NEEDS:([^.]*\.?)/g,'').trim();}
function fill(id,s){var el=$(id),h=txt(s);el.innerHTML=h;el.hidden=!h;el.previousElementSibling.hidden=!h;}
var $=function(id){return document.getElementById(id);};

/* left column */
$('hello').innerHTML=SITE.hello.map(function(l){return '<span>'+esc(l)+'</span>';}).join('');
$('sub').textContent=SITE.sub; $('ket').textContent=SITE.ket;
$('name').textContent=SITE.name; $('seek').textContent=SITE.seeking; $('notice').textContent=SITE.notice;
if(SITE.headshot){$('photo').innerHTML='<img src="'+esc(SITE.headshot)+'" alt="'+esc(SITE.name)+'">';}
$('links').innerHTML=[['Email','mailto:'+SITE.email],['CV',SITE.cv],['Google Scholar',SITE.scholar],['LinkedIn',SITE.linkedin]].map(function(l){var ext=/^https?:/.test(l[1]);return '<a href="'+esc(l[1])+'"'+(ext?' target="_blank" rel="noopener"':'')+'>'+l[0]+'</a>';}).join('');
$('cvlink').href=SITE.cv;
var cv=$('cvlink'); for(var i=0;i<9;i++){var s=document.createElement('span');s.style.top=(12+i*8.5)+'%';s.style.right=(12+(i%3)*10)+'%';cv.appendChild(s);}

/* hand-drawn doodles (black ink on the white tiles) */
var S='fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"';
var D={
 eit:'<path '+S+' d="M4 10 C 30 12, 40 52, 47 52 C 49 52, 49 18, 50 18 C 51 18, 51 52, 53 52 C 60 52, 70 12, 96 10"/><path '+S+' d="M4 56 H96" opacity=".35"/>',
 peak:'<path '+S+' d="M4 54 C 25 52, 35 30, 46 30 C 48 30, 49 4, 51 4 C 53 4, 54 30, 56 30 C 66 30, 76 52, 96 54"/><text x="62" y="16" font-family="Caveat" font-size="13" fill="#111">lasing</text><text x="6" y="36" font-family="Caveat" font-size="12" fill="#111">ASE</text>',
 feather:'<path '+S+' d="M50 58 C 48 40, 46 20, 50 4"/><ellipse '+S+' cx="50" cy="22" rx="20" ry="17"/><ellipse cx="50" cy="22" rx="9" ry="8" fill="#1f6f8b"/><ellipse cx="50" cy="22" rx="4" ry="4" fill="#111"/><path '+S+' d="M30 30 L18 40 M70 30 L82 40 M28 18 L14 16 M72 18 L86 16"/>',
 gp:'<path d="M4 30 C 25 6, 40 10, 50 30 S 80 54, 96 20 L96 40 C 80 70, 60 50, 50 44 S 25 24, 4 50 Z" fill="rgba(224,160,58,.35)"/><path '+S+' d="M4 40 C 25 18, 40 22, 50 37 S 80 62, 96 30"/>',
 battery:'<rect '+S+' x="12" y="14" width="66" height="34" rx="5"/><rect x="78" y="24" width="7" height="14" rx="2" fill="#111"/><rect x="17" y="19" width="22" height="24" rx="2" fill="#e0a03a"/><path '+S+' d="M46 31 h22 M57 20 v22" opacity=".0"/><path '+S+' d="M48 22 C 52 30, 44 34, 50 42 M58 22 C 62 30, 54 34, 60 42" stroke="#c0392b"/>',
 turbine:'<path '+S+' d="M50 58 V14"/><path '+S+' d="M36 10 C 30 24, 30 40, 36 54 M64 10 C 70 24, 70 40, 64 54"/><path '+S+' d="M36 32 H64"/><path '+S+' d="M6 20 C 14 16, 20 24, 28 20 M4 34 C 12 30, 18 38, 26 34" opacity=".55"/>',
 solver:'<path '+S+' d="M10 50 L30 14 L50 50 Z M30 14 L70 14 L50 50 M70 14 L90 50 L50 50"/><path '+S+' d="M6 30 C 20 22, 26 38, 40 30 S 60 22, 94 32" stroke="#e0a03a"/>',
 micro:'<rect '+S+' x="6" y="10" width="38" height="38" rx="3"/><rect '+S+' x="56" y="10" width="38" height="38" rx="3"/><g fill="#111"><circle cx="16" cy="20" r="3"/><circle cx="30" cy="26" r="3"/><circle cx="20" cy="38" r="3"/><circle cx="66" cy="20" r="3"/><circle cx="80" cy="26" r="3"/><circle cx="70" cy="38" r="3"/></g><path '+S+' d="M34 54 C 44 60, 56 60, 66 54" /><path d="M60 52 L67 54 L63 60" '+S+'/>',
 brain:'<path '+S+' d="M28 50 C 10 50, 6 34, 14 26 C 10 14, 24 6, 34 10 C 40 2, 58 2, 64 10 C 76 6, 90 14, 86 26 C 94 34, 88 50, 72 50 C 64 58, 40 58, 28 50 Z"/><path '+S+' d="M50 8 V52 M30 24 C 36 28, 36 34, 30 38 M70 24 C 64 28, 64 34, 70 38"/><g fill="#1f8f8b"><circle cx="22" cy="32" r="3.2"/><circle cx="40" cy="18" r="3.2"/><circle cx="62" cy="40" r="3.2"/><circle cx="78" cy="30" r="3.2"/></g>',
 ot:'<path '+S+' d="M4 52 C 14 52, 16 22, 24 22 C 32 22, 34 52, 44 52"/><path '+S+' d="M56 52 C 62 52, 64 36, 70 36 C 74 36, 76 14, 82 14 C 88 14, 90 52, 96 52"/><path '+S+' d="M30 14 C 44 4, 58 4, 68 10"/><path '+S+' d="M62 6 L69 10 L62 15"/>',
 chart:'<path '+S+' d="M8 54 H94 M8 54 V6"/><rect x="18" y="30" width="12" height="24" fill="#111"/><rect x="38" y="20" width="12" height="34" fill="#111"/><rect x="58" y="36" width="12" height="18" fill="#111"/><rect x="78" y="14" width="12" height="40" fill="#e0a03a"/>',
 notes:'<rect '+S+' x="14" y="6" width="56" height="48" rx="4"/><path '+S+' d="M22 18 H60 M22 28 H54 M22 38 H58"/><path d="M60 40 L84 16 L90 22 L66 46 L58 48 Z" fill="#e0a03a" stroke="#111" stroke-width="2"/>'
};
function doodle(k){return '<svg viewBox="0 0 100 60" aria-hidden="true">'+(D[k]||'')+'</svg>';}

/* Venn */
var v=$('venn'), h='';
VENN.circles.forEach(function(c){h+='<circle cx="'+c.cx+'" cy="'+c.cy+'" r="'+c.r+'" fill="'+c.color+'" style="mix-blend-mode:screen"/>';});
h+='<text class="vlabel" x="500" y="26" text-anchor="middle">Physics</text>';
h+='<text class="vlabel" x="150" y="772" text-anchor="middle">Machine Learning</text>';
h+='<text class="vlabel" x="850" y="772" text-anchor="middle">Visualization &amp; Perception</text>';
VENN.center.forEach(function(l,i){h+='<text class="vcenter" x="500" y="'+(452+i*24)+'" text-anchor="middle">'+esc(l)+'</text>';});
v.innerHTML=h;

/* tiles */
var stage=$('stage'), rots=[-3,2,-2,3,-1,2,-3,1,-2,3,-1];
TILES.forEach(function(t,i){
  var b=document.createElement('button');b.className='tile'+(t.tag==='upcoming'?' soon':'');
  b.style.left=(t.x/10)+'%';b.style.top=(t.y/8)+'%';b.style.setProperty('--rot',rots[i%rots.length]+'deg');b.style.setProperty('--d',(0.5+i*0.07)+'s');
  b.dataset.n=i+1;b.setAttribute('aria-label',t.title+', '+t.tag+'. Open details.');
  b.innerHTML='<b>'+esc(t.title)+'</b>'+doodle(t.doodle)+'<i>'+esc(t.tag)+'</i>';
  b.onclick=function(){open(t,b);};stage.appendChild(b);
});

/* phone list, grouped by zone */
var ZN={P:'Physics',PM:'Physics + ML',PV:'Physics + Vis',MV:'ML + Vis',M:'Machine Learning',V:'Visualization'}, order=['P','PM','PV','MV','M','V'], lh='';
order.forEach(function(z){var items=TILES.map(function(t,i){return [t,i];}).filter(function(p){return p[0].zone===z;});if(!items.length)return;
  lh+='<div class="grp">'+ZN[z]+'</div>';items.forEach(function(p){lh+='<button data-i="'+p[1]+'"><span>'+(p[1]+1)+'</span><b>'+esc(p[0].title)+'</b>'+doodle(p[0].doodle)+'<i>'+esc(p[0].tag)+'</i></button>';});});
$('list').innerHTML=lh;
[].forEach.call($('list').querySelectorAll('button'),function(b){b.onclick=function(){open(TILES[+b.dataset.i],b);};});

/* drawer */
var dr=$('drawer'),sc=$('scrim'),last=null;
function open(t,from){last=from;var p=t.panel;
  $('dArt').innerHTML=doodle(t.doodle);$('dArea').textContent=p.area;$('dTitle').textContent=t.title;
  fill('dQ',p.q);fill('dDid',p.did);fill('dFound',p.found);
  $('dLinks').innerHTML=(p.links||[]).map(function(l){var ext=/^https?:/.test(l[1]);return '<a href="'+esc(l[1])+'"'+(ext?' target="_blank" rel="noopener"':'')+'>'+esc(l[0])+(ext?' ↗':'')+'</a>';}).join('');
  dr.classList.add('on');sc.classList.add('on');dr.setAttribute('aria-hidden','false');dr.scrollTop=0;$('dClose').focus();}
function close(){dr.classList.remove('on');sc.classList.remove('on');dr.setAttribute('aria-hidden','true');if(last)last.focus();}
$('dClose').onclick=close;sc.onclick=close;
addEventListener('keydown',function(e){if(e.key==='Escape'&&dr.classList.contains('on'))close();});
